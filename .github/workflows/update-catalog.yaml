# Scrapes the KSJ site weekly and opens a pull request when the catalog or
# the attribute table changed. Pull requests opened with `GITHUB_TOKEN` do not
# trigger other workflows, so R-CMD-check is dispatched on the branch.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

name: update-catalog.yaml

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::readxl
            any::rvest
            any::tidyr

      - name: Update
        run: Rscript data-raw/update.R 2>&1 | tee "$RUNNER_TEMP/report.txt"

      - name: Write the body of the pull request
        run: |
          {
            echo "Updates the catalog and the attribute table from the KSJ site."
            echo
            echo '```'
            # The body of a pull request is limited to 65,536 characters.
            head -c 60000 "$RUNNER_TEMP/report.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-catalog
          commit-message: Update the catalog from the KSJ site
          title: Update the catalog from the KSJ site
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true

      - name: Check
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run R-CMD-check.yaml --ref update-catalog
